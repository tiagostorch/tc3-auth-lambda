name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.13.3"
  NODE_VERSION: "22"
  TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}

  # ─── New Relic ──────────────────────────────────────────────────────────────
  # A license key não passa por aqui: a função a lê do SSM, onde tc3-infra-k8s a
  # publicou. Do CI vêm só o account ID — que o agente usa para marcar o trace e
  # ligá-lo ao da API no cluster — e a ARN da layer.
  TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}

  # Configuração, não segredo, e por isso *variable* e não secret: a ARN é
  # pública e mascará-la no log esconde justamente o valor que se quer conferir
  # quando a instrumentação não sobe.
  #
  # Muda por região e a cada release do agente; a lista publicada está em
  # https://layers.newrelic-external.com (procurar NewRelicNodeJS22X). Vazia com
  # `newrelic_enabled = true`, o plan falha com a explicação — de propósito, já
  # que a alternativa é uma função sem instrumentação que ninguém percebe.
  TF_VAR_newrelic_layer_arn: ${{ vars.NEWRELIC_LAYER_ARN }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # O plan precisa do artefato: o hash do zip entra no state da função.
      - name: Empacotar a função
        run: |
          npm ci
          npm run package

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: infra
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Validate
        working-directory: infra
        run: terraform validate

      - name: Plan
        working-directory: infra
        run: terraform plan -no-color

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Empacotar a função
        run: |
          npm ci
          npm run package

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: infra
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Endpoint publicado
        working-directory: infra
        run: terraform output -raw auth_url
