name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.13.3"
  NODE_VERSION: "22"
  TF_VAR_state_bucket: ${{ secrets.TF_STATE_BUCKET }}

  # Listener do ALB criado em runtime pelo Ingress do app no EKS (não é output de
  # Terraform, por isso entra aqui como valor manual). Preenchido, liga o VPC Link
  # e a rota `ANY /{proxy+}`, fazendo o API Gateway rotear também as rotas
  # protegidas da aplicação. Se o Ingress for recriado, este ARN muda.
  TF_VAR_alb_listener_arn: "arn:aws:elasticloadbalancing:us-east-1:008363475762:listener/app/k8s-oficina-oficinaa-5b75d4a62f/2dc7b23786aa56f3/93200dd5c8cdce83"

  # ─── New Relic ──────────────────────────────────────────────────────────────
  # A license key não passa por aqui: a função a lê do SSM, onde tc3-infra-k8s a
  # publicou. Do CI vêm só o account ID — que o agente usa para marcar o trace e
  # ligá-lo ao da API no cluster — e a ARN da layer.
  TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}

  # Configuração, não segredo, e por isso *variable* e não secret: a ARN é
  # pública e mascará-la no log esconde justamente o valor que se quer conferir
  # quando a instrumentação não sobe.
  #
  # Muda por região e a cada release do agente; a lista publicada está em
  # https://layers.newrelic-external.com (procurar NewRelicNodeJS22X). Vazia com
  # `newrelic_enabled = true`, o plan falha com a explicação — de propósito, já
  # que a alternativa é uma função sem instrumentação que ninguém percebe.
  TF_VAR_newrelic_layer_arn: ${{ vars.NEWRELIC_LAYER_ARN }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # O plan precisa do artefato: o hash do zip entra no state da função.
      - name: Empacotar a função
        run: |
          npm ci
          npm run package

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: infra
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Validate
        working-directory: infra
        run: terraform validate

      - name: Plan
        working-directory: infra
        run: terraform plan -no-color

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push'
    environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Empacotar a função
        run: |
          npm ci
          npm run package

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        working-directory: infra
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Endpoint publicado
        working-directory: infra
        run: terraform output -raw auth_url
